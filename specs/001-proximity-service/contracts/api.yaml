openapi: 3.0.3
info:
  title: Proximity Service API
  version: 1.0.0
  description: 주변 사업장 검색 서비스 API

servers:
  - url: http://localhost:8080/api
    description: Local development

paths:
  /search:
    get:
      operationId: searchBusinesses
      summary: 반경 내 사업장 검색
      description: 위도/경도 기반으로 지정 반경 내 사업장 목록을 반환한다.
      tags:
        - Search
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 37.5665
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 126.9780
        - name: radius
          in: query
          required: true
          schema:
            type: number
            format: double
            enum: [0.5, 1, 2, 5, 20]
          description: 검색 반경 (km)
          example: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: 잘못된 요청 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /businesses/{id}:
    get:
      operationId: getBusinessDetail
      summary: 사업장 상세 정보 조회
      tags:
        - Business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 사업장 상세 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDetailResponse'
        '404':
          description: 사업장을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /businesses:
    post:
      operationId: createBusiness
      summary: 사업장 등록
      tags:
        - Business Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessRequest'
      responses:
        '201':
          description: 사업장 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDetailResponse'
        '400':
          description: 유효하지 않은 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /businesses/{id}/update:
    put:
      operationId: updateBusiness
      summary: 사업장 정보 수정
      tags:
        - Business Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessRequest'
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDetailResponse'
        '403':
          description: 권한 없음 (소유주가 아닌 경우)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 사업장을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /businesses/{id}/delete:
    delete:
      operationId: deleteBusiness
      summary: 사업장 삭제
      tags:
        - Business Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 삭제 완료
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 사업장을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /owners/signup:
    post:
      operationId: ownerSignup
      summary: 소유주 회원가입
      tags:
        - Owner Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerSignupRequest'
      responses:
        '201':
          description: 회원가입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerTokenResponse'
        '400':
          description: 유효하지 않은 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 이미 등록된 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /owners/login:
    post:
      operationId: ownerLogin
      summary: 소유주 로그인
      tags:
        - Owner Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerTokenResponse'
        '401':
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SearchResponse:
      type: object
      properties:
        businesses:
          type: array
          items:
            $ref: '#/components/schemas/BusinessSummary'
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20

    BusinessSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "스타벅스 강남점"
        address:
          type: string
          example: "서울특별시 강남구 테헤란로 101"
        latitude:
          type: number
          format: double
          description: 사업장 위도
          example: 37.4979
        longitude:
          type: number
          format: double
          description: 사업장 경도
          example: 127.0276
        distance:
          type: number
          format: double
          description: 사용자 위치로부터의 거리 (m)
          example: 350.0
        category:
          type: string
          example: "카페"

    BusinessDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        phone:
          type: string
        category:
          type: string
        ownerId:
          type: integer
          format: int64
        businessHours:
          type: array
          items:
            $ref: '#/components/schemas/BusinessHour'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BusinessHour:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: "0=월 ~ 6=일"
        openTime:
          type: string
          format: time
          example: "09:00"
        closeTime:
          type: string
          format: time
          example: "22:00"
        closed:
          type: boolean
          example: false

    BusinessHourRequest:
      type: object
      description: 사업장 영업시간 등록/수정 요청용 스키마 (id 없음)
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: "0=월 ~ 6=일"
        openTime:
          type: string
          example: "09:00"
        closeTime:
          type: string
          example: "22:00"
        closed:
          type: boolean
          example: false

    Photo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        photoUrl:
          type: string
          format: uri
        displayOrder:
          type: integer

    CreateBusinessRequest:
      type: object
      required:
        - name
        - address
        - latitude
        - longitude
      properties:
        name:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 500
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        phone:
          type: string
          maxLength: 20
        category:
          type: string
          maxLength: 100
        businessHours:
          type: array
          items:
            $ref: '#/components/schemas/BusinessHourRequest'

    UpdateBusinessRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 500
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        phone:
          type: string
          maxLength: 20
        category:
          type: string
          maxLength: 100
        businessHours:
          type: array
          items:
            $ref: '#/components/schemas/BusinessHourRequest'

    OwnerSignupRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 4
        name:
          type: string

    OwnerLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    OwnerTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT 인증 토큰
        ownerId:
          type: integer
          format: int64
        name:
          type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "INVALID_PARAMETER"
        message:
          type: string
          example: "유효하지 않은 위도 값입니다"
