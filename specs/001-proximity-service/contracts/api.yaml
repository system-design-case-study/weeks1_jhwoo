openapi: 3.0.3
info:
  title: Proximity Service API
  version: 1.0.0
  description: 주변 사업장 검색 서비스 API

servers:
  - url: http://localhost:8080/api
    description: Local development

paths:
  /search:
    get:
      operationId: searchBusinesses
      summary: 반경 내 사업장 검색
      description: 위도/경도 기반으로 지정 반경 내 사업장 목록을 반환한다.
      tags:
        - Search
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 37.5665
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 126.9780
        - name: radius
          in: query
          required: true
          schema:
            type: number
            format: double
            enum: [0.5, 1, 2, 5, 20]
          description: 검색 반경 (km)
          example: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: 잘못된 요청 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /search/geohash:
    get:
      operationId: searchByGeohash
      summary: Geohash 기반 사업장 검색 (학습·비교 용도)
      description: |
        Manual Geohash 구현체를 사용한 검색 결과를 반환한다.
        PostGIS ST_DWithin 결과와 비교하여 셀 경계 문제와 정밀도 차이를 확인하기 위한 학습용 엔드포인트.
      tags:
        - Search
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 37.5665
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 126.9780
        - name: precision
          in: query
          required: false
          schema:
            type: integer
            default: 6
            minimum: 4
            maximum: 7
          description: Geohash 정밀도 (4~7, 기본값 6)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Geohash 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeohashSearchResponse'
        '400':
          description: 잘못된 요청 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /businesses/{id}:
    get:
      operationId: getBusinessDetail
      summary: 사업장 상세 정보 조회
      tags:
        - Business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 사업장 상세 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDetailResponse'
        '404':
          description: 사업장을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /businesses:
    post:
      operationId: createBusiness
      summary: 사업장 등록
      tags:
        - Business Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessRequest'
      responses:
        '201':
          description: 사업장 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDetailResponse'
        '400':
          description: 유효하지 않은 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /businesses/{id}/update:
    put:
      operationId: updateBusiness
      summary: 사업장 정보 수정
      tags:
        - Business Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessRequest'
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDetailResponse'
        '403':
          description: 권한 없음 (소유주가 아닌 경우)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 사업장을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /businesses/{id}/delete:
    delete:
      operationId: deleteBusiness
      summary: 사업장 삭제
      tags:
        - Business Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 삭제 완료
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 사업장을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SearchResponse:
      type: object
      properties:
        businesses:
          type: array
          items:
            $ref: '#/components/schemas/BusinessSummary'
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20

    GeohashSearchResponse:
      type: object
      properties:
        geohash:
          type: string
          description: 요청 좌표에서 생성된 Geohash 문자열
          example: "wydm9q"
        precision:
          type: integer
          description: 사용된 Geohash 정밀도
          example: 6
        cellBounds:
          type: object
          description: Geohash 셀의 경계 좌표
          properties:
            minLatitude:
              type: number
              format: double
            maxLatitude:
              type: number
              format: double
            minLongitude:
              type: number
              format: double
            maxLongitude:
              type: number
              format: double
        businesses:
          type: array
          items:
            $ref: '#/components/schemas/BusinessSummary'
        total:
          type: integer
          example: 15
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20

    BusinessSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "스타벅스 강남점"
        address:
          type: string
          example: "서울특별시 강남구 테헤란로 101"
        distance:
          type: number
          format: double
          description: 사용자 위치로부터의 거리 (km)
          example: 0.35
        category:
          type: string
          example: "카페"

    BusinessDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        phone:
          type: string
        category:
          type: string
        businessHours:
          type: array
          items:
            $ref: '#/components/schemas/BusinessHour'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'

    BusinessHour:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: "0=월 ~ 6=일"
        openTime:
          type: string
          format: time
          example: "09:00"
        closeTime:
          type: string
          format: time
          example: "22:00"
        isClosed:
          type: boolean
          example: false

    Photo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          format: uri
        displayOrder:
          type: integer

    CreateBusinessRequest:
      type: object
      required:
        - name
        - address
        - latitude
        - longitude
      properties:
        name:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 500
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        phone:
          type: string
          maxLength: 20
        category:
          type: string
          maxLength: 100
        businessHours:
          type: array
          items:
            $ref: '#/components/schemas/BusinessHour'

    UpdateBusinessRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 500
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        phone:
          type: string
          maxLength: 20
        category:
          type: string
          maxLength: 100
        businessHours:
          type: array
          items:
            $ref: '#/components/schemas/BusinessHour'

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "INVALID_PARAMETER"
        message:
          type: string
          example: "유효하지 않은 위도 값입니다"
