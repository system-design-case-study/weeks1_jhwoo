services:
  postgres-primary:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: proximity-postgres-primary
    environment:
      POSTGRES_DB: proximity
      POSTGRES_USER: proximity
      POSTGRES_PASSWORD: proximity_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./docker/postgres/primary/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./docker/postgres/primary/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proximity"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - proximity-net

  postgres-replica-1:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: proximity-postgres-replica-1
    environment:
      PGUSER: replicator
      PGPASSWORD: replicator_password
      REPLICA_NAME: replica_1
      REPLICA_SLOT: replica_1_slot
    ports:
      - "5433:5432"
    volumes:
      - postgres-replica-1-data:/var/lib/postgresql/data
      - ./docker/postgres/replica/init-replica.sh:/init-replica.sh
    entrypoint: |
      bash -c '
      if [ ! -f /var/lib/postgresql/data/standby.signal ]; then
        /init-replica.sh
      fi
      exec docker-entrypoint.sh postgres
      '
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proximity"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - proximity-net

  postgres-replica-2:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: proximity-postgres-replica-2
    environment:
      PGUSER: replicator
      PGPASSWORD: replicator_password
      REPLICA_NAME: replica_2
      REPLICA_SLOT: replica_2_slot
    ports:
      - "5434:5432"
    volumes:
      - postgres-replica-2-data:/var/lib/postgresql/data
      - ./docker/postgres/replica/init-replica.sh:/init-replica.sh
    entrypoint: |
      bash -c '
      if [ ! -f /var/lib/postgresql/data/standby.signal ]; then
        /init-replica.sh
      fi
      exec docker-entrypoint.sh postgres
      '
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proximity"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - proximity-net

  redis:
    image: redis:7-alpine
    container_name: proximity-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - proximity-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proximity-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica-1:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proximity-net

  csv-loader:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: proximity-csv-loader
    volumes:
      - ./식품_일반음식점.csv:/data/data.csv:ro
    command:
      - "--file"
      - "/data/data.csv"
      - "--db-host"
      - "postgres-primary"
      - "--wait"
      - "120"
    depends_on:
      postgres-primary:
        condition: service_healthy
    profiles:
      - seed
    networks:
      - proximity-net

  nginx:
    image: nginx:alpine
    container_name: proximity-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - proximity-net

  prometheus:
    image: prom/prometheus:latest
    container_name: proximity-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - proximity-net

  grafana:
    image: grafana/grafana:latest
    container_name: proximity-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - proximity-net

volumes:
  postgres-primary-data:
  postgres-replica-1-data:
  postgres-replica-2-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  proximity-net:
    driver: bridge
