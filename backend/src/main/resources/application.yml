spring:
  application:
    name: proximity-service

  datasource:
    primary:
      jdbc-url: jdbc:postgresql://localhost:5432/proximity
      username: proximity
      password: proximity_password
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: primary-pool
        maximum-pool-size: 10
        minimum-idle: 5
    replica:
      jdbc-url: jdbc:postgresql://localhost:5433/proximity
      username: proximity
      password: proximity_password
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: replica-pool
        maximum-pool-size: 20
        minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

jwt:
  secret: proximity-jwt-secret-key-for-development-must-be-at-least-256-bits-long
  expiration-ms: 3600000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
