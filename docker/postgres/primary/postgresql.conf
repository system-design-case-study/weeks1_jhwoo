listen_addresses = '*'
port = 5432

# Replication
wal_level = replica
max_wal_senders = 4
wal_keep_size = 256MB
hot_standby = on

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'

# Performance
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 128MB
